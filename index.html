<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Студенттерге арналған панель: кесте, үй жұмысы, пәндер, анықтама және допуск есебі.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Студент панелі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: campus-photo landing → overlapping student dashboard → 3D tab buttons → one panel per section.
   Palette from the AIU photo: glass blue (accent), sign navy, sandstone facade, gold band. */
:root {
  --accent: #1f5fbf;
  --navy: #1b2a7a;
  --sand: #e3cba3;
  --sand-soft: #f7f0e3;
  --bg: #f2f5fa;
  --surface: #ffffff;
  --glass: rgba(255,255,255,.72);
  --sunk: #eef2f9;
  --ink: #0e1b3d;
  --muted: #586683;
  --line: #dde4ef;
  --gold: #b9832a;
  --ok: #1f8a54;   --warn: #b56d00; --bad: #c53a32;
  --shadow: 0 1px 2px rgba(15,27,45,.06), 0 8px 24px rgba(29,95,209,.08);
  --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--surface));
  --accent-deep: color-mix(in srgb, var(--accent) 68%, #000);
  --accent-ink: #ffffff;
  --ok-soft: color-mix(in srgb, var(--ok) 13%, var(--surface));
  --warn-soft: color-mix(in srgb, var(--warn) 14%, var(--surface));
  --bad-soft: color-mix(in srgb, var(--bad) 12%, var(--surface));
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1226; --surface: #111c36; --glass: rgba(17,28,54,.74); --sunk: #0d1730; --ink: #e8eefb; --muted: #97a6c2; --line: #223154;
    --navy: #aab8ff; --sand: #6b5a3c; --sand-soft: #241f16; --gold: #e6b45a; --ok: #4fc285; --warn: #f0a845; --bad: #f07a70;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1226; --surface: #111c36; --glass: rgba(17,28,54,.74); --sunk: #0d1730; --ink: #e8eefb; --muted: #97a6c2; --line: #223154;
  --navy: #aab8ff; --sand: #6b5a3c; --sand-soft: #241f16; --gold: #e6b45a; --ok: #4fc285; --warn: #f0a845; --bad: #f07a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 56px;
  overflow-x: hidden;
}
/* soft moving light behind everything */
.aura { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--bg); }
.aura i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .35; background: var(--accent); }
.aura i:nth-child(1) { top: -22vmax; left: -12vmax; }
.aura i:nth-child(2) { bottom: -26vmax; right: -14vmax; background: color-mix(in srgb, var(--accent) 55%, #22c1ee); opacity: .22; }
@media (prefers-reduced-motion: no-preference) {
  .aura i:nth-child(1) { animation: drift 22s ease-in-out infinite alternate; }
  .aura i:nth-child(2) { animation: drift 28s ease-in-out infinite alternate-reverse; }
}
@keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.1); } }

.app { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 700 clamp(20px, 3vw, 26px)/1.15 var(--f-display); letter-spacing: -0.015em; }
h2 { font: 700 18px/1.3 var(--f-body); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* ===== 3D button ===== */
.b3 {
  --face: var(--surface); --edge: var(--line); --txt: var(--ink); --depth: 4px;
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--edge); border-radius: 12px; padding: 9px 16px;
  background: var(--face); color: var(--txt); font-weight: 600; cursor: pointer; user-select: none;
  box-shadow: 0 var(--depth) 0 var(--edge), 0 calc(var(--depth) + 6px) 14px rgba(15,27,45,.10);
  transform: translateY(0);
  transition: transform .12s cubic-bezier(.3,.7,.4,1.4), box-shadow .12s, background-color .25s, color .25s, border-color .25s;
}
.b3:hover { transform: translateY(-2px); box-shadow: 0 calc(var(--depth) + 2px) 0 var(--edge), 0 calc(var(--depth) + 12px) 20px rgba(15,27,45,.14); }
.b3:active, .b3.pressed {
  transform: translateY(var(--depth));
  box-shadow: 0 0 0 var(--edge), 0 2px 6px rgba(15,27,45,.12);
  --face: var(--accent); --txt: var(--accent-ink); --edge: var(--accent-deep);
}
.b3.primary { --face: var(--accent); --edge: var(--accent-deep); --txt: var(--accent-ink); }
.b3.primary:active, .b3.primary.pressed { --face: color-mix(in srgb, var(--accent) 60%, #22c1ee); --edge: var(--accent-deep); }
.b3[aria-pressed="true"] { --face: var(--accent); --edge: var(--accent-deep); --txt: var(--accent-ink); }
.b3.sm { padding: 5px 12px; border-radius: 10px; --depth: 3px; font-size: 13.5px; }
.b3 svg { width: 18px; height: 18px; flex: none; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .28; transform: scale(0); z-index: -1; }
@media (prefers-reduced-motion: no-preference) { .ripple { animation: rip .55s ease-out forwards; } }
@keyframes rip { to { transform: scale(2.6); opacity: 0; } }

/* ===== landing (campus photo) ===== */
.landing {
  position: relative; isolation: isolate; overflow: hidden; border-radius: 24px;
  min-height: clamp(330px, 46vw, 460px); display: grid; align-items: end;
  background: #1b2a55; box-shadow: var(--shadow);
}
.land-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; z-index: -2; }
.land-shade {
  position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(180deg, rgba(8,16,42,0) 28%, rgba(8,16,42,.55) 60%, rgba(8,16,42,.9) 100%),
    linear-gradient(90deg, rgba(8,16,42,.5), rgba(8,16,42,0) 62%);
}
.land-body { display: grid; gap: 12px; padding: 28px; max-width: 640px; color: #fff; min-width: 0; }
.landing h1 { color: #fff; font-size: clamp(24px, 4.2vw, 40px); line-height: 1.1; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
.land-sub { color: rgba(255,255,255,.9); font-size: 16px; max-width: 52ch; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-glass {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; color: #fff;
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.chip-glass.gold { background: color-mix(in srgb, #e6b45a 30%, transparent); border-color: rgba(230,180,90,.6); }
.b3.glass { --face: rgba(255,255,255,.14); --edge: rgba(255,255,255,.4); --txt: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.land-note { font-size: 12px; color: rgba(255,255,255,.72); }
@media (prefers-reduced-motion: no-preference) {
  .land-img { animation: settle 1.1s cubic-bezier(.2,.7,.2,1); }
  .dash > * { animation: lift .35s cubic-bezier(.2,.8,.2,1) backwards; }
  .dash > *:nth-child(2) { animation-delay: .05s; }
  .dash > *:nth-child(3) { animation-delay: .1s; }
}
@media (max-width: 560px) {
  .landing { min-height: 300px; border-radius: 20px; }
  .land-img { object-position: 58% 40%; }
  .land-body { padding: 18px; gap: 10px; }
  .landing h1 { font-size: 24px; }
  .land-sub { font-size: 14.5px; }
  .land-body .b3 { padding: 7px 12px; font-size: 14px; }
  #open-settings span { display: none; }
  .brand { font-size: 15px; }
}
@keyframes settle { from { transform: scale(1.05); } }
@keyframes lift { from { transform: translateY(10px); } }

/* ===== dashboard ===== */
.dash { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 14px; align-items: stretch; }
@media (min-width: 901px) {
  .dash { margin-top: -72px; padding-inline: 18px; position: relative; z-index: 1; }
  .land-body { padding-bottom: 96px; }
}
@media (max-width: 900px) { .dash { grid-template-columns: 1fr 1fr; } .dash .next { grid-column: 1 / -1; } }
@media (max-width: 560px) { .dash { grid-template-columns: 1fr; } }
.dash .box { display: grid; gap: 10px; align-content: start; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini-hw { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.mini-hw:first-child { border-top: 0; padding-top: 0; }
.mini-hw p { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.adm-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.adm-row div { background: var(--sunk); border-radius: 12px; padding: 8px 10px; display: grid; }
.adm-row b { font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.adm-row span { font-size: 12px; color: var(--muted); }
.link-btn { justify-self: start; }

.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }

.topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 16px var(--f-display); }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 3px 0 var(--accent-deep); }
.brand .logo svg { width: 20px; height: 20px; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ===== tabs ===== */
.tabs-wrap { overflow-x: auto; padding: 4px 2px 12px; margin: 0 -2px; scrollbar-width: none; }
.tabs { display: flex; gap: 10px; min-width: max-content; }

.panel { display: grid; gap: 16px; }
@media (prefers-reduced-motion: no-preference) { .panel:not([hidden]) { animation: rise .28s cubic-bezier(.2,.8,.2,1); } }
@keyframes rise { from { transform: translateY(8px); } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.tilt { transform-style: preserve-3d; transition: transform .2s ease-out; will-change: transform; }

.field { display: grid; gap: 5px; min-width: 0; }
.field input, .field select, .field textarea, .inp {
  border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 9px 11px; width: 100%;
  transition: border-color .2s, box-shadow .2s;
}
.field input:focus, .field textarea:focus, .field select:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { resize: vertical; min-height: 74px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.idle { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }

/* schedule */
.next { display: grid; gap: 8px; border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); background: linear-gradient(140deg, var(--sand-soft), var(--surface) 75%); }
.next .room-big { font: 700 26px/1.1 var(--f-display); color: var(--accent); }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; }
.lesson { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; padding: 12px 10px; border-radius: 12px; align-items: center; transition: background .2s; }
.lesson + .lesson { border-top: 1px solid var(--line); border-radius: 0; }
.lesson:hover { background: var(--sunk); }
.lesson .t { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.lesson .room { text-align: right; font-weight: 600; }
.lesson.now { background: var(--accent-soft); border-radius: 12px; }
.lesson.past { opacity: .5; }
@media (max-width: 520px) { .lesson { grid-template-columns: 1fr auto; } .lesson .t { grid-column: 1 / -1; } }

/* homework */
.hw { display: grid; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
.hw:first-child { border-top: 0; }
.hw.done .text { text-decoration: line-through; color: var(--muted); }
.hw-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hw-form .wide { grid-column: 1 / -1; }
@media (max-width: 520px) { .hw-form { grid-template-columns: 1fr; } }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }

/* subjects */
.subj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; perspective: 900px; }
.subj-card { text-align: left; display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: var(--r); }
.subj-card .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 15px var(--f-display); transition: background .25s, color .25s; }
.subj-card[aria-pressed="true"] .ico, .subj-card:active .ico { background: var(--accent-ink); color: var(--accent); }
.subj-card .meta { font-weight: 400; font-size: 13px; opacity: .8; }
.mat-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 720px) { .mat-cols { grid-template-columns: 1fr; } }
.mat-cols ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.mat-cols li { padding: 10px 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.mat-cols li .muted { display: block; font-size: 12.5px; }

/* info */
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; font-size: 16px; box-shadow: var(--shadow); }
.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.quick { display: flex; flex-wrap: wrap; gap: 10px; }
details.faq { border-top: 1px solid var(--line); padding: 14px 0; }
details.faq:first-child { border-top: 0; }
details.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; color: var(--accent); font-weight: 700; transition: transform .25s; }
details.faq[open] summary::after { transform: rotate(45deg); }
details.faq .body { margin-top: 8px; color: var(--muted); max-width: 65ch; }

/* dopusk */
.d-sum { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
@media (max-width: 720px) { .d-sum { grid-template-columns: 1fr 1fr; } }
.d-sum .stat { border-radius: 14px; }
.dtable-wrap { overflow-x: auto; margin: 0 -6px; padding: 0 6px; }
table.dt { width: 100%; border-collapse: collapse; min-width: 760px; }
.dt th, .dt td { text-align: left; padding: 9px 6px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.dt thead th { border-top: 0; }
.dt td.calc { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.dt td.calc.strong { color: var(--ink); font-weight: 600; }
.dt input { width: 64px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 6px 7px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.dt input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dt tr { cursor: pointer; transition: background .2s; }
.dt tbody tr:hover td { background: var(--sunk); }
.dt tr.sel td { background: var(--accent-soft); }
.dt th.grp { color: var(--accent); }
.d-detail { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; }
@media (max-width: 640px) { .d-detail { grid-template-columns: 1fr; justify-items: center; } .d-detail > div:last-child { justify-self: stretch; } }
.ring { width: 200px; height: 200px; }
.ring .track { stroke: var(--sunk); }
.ring .arc { stroke: var(--accent); transition: stroke-dasharray .8s cubic-bezier(.2,.8,.2,1), stroke .3s; }
.ring .tick { stroke: var(--ink); opacity: .55; }
.ring text { fill: var(--ink); font-family: var(--f-display); }
.ring .sub { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.steps { display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; }
.step .k { font: 700 13px var(--f-display); color: var(--accent); }
.step .v { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.grade { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 1px; background: var(--surface); }
.grade .g { font: 700 16px var(--f-display); }
.grade.stip { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.grade.no { opacity: .4; }
.callout { padding: 12px 14px; border-radius: 12px; font-weight: 500; }
.callout.ok { background: var(--ok-soft); color: var(--ok); }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.bad { background: var(--bad-soft); color: var(--bad); }
.callout.info { background: var(--accent-soft); color: var(--accent); }
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; overflow-x: auto; display: grid; gap: 4px; }
.formula div { white-space: nowrap; }

.note { font-size: 12.5px; color: var(--muted); }

/* settings drawer */
.scrim { position: fixed; inset: 0; background: rgba(8,14,26,.35); z-index: 30; backdrop-filter: blur(2px); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); z-index: 31;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(0,0,0,.18);
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) 20px;
  display: grid; align-content: start; gap: 22px; overflow-y: auto;
}
@media (prefers-reduced-motion: no-preference) { .drawer:not([hidden]) { animation: slide .3s cubic-bezier(.2,.8,.2,1); } }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.opt { display: grid; gap: 10px; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer; background: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 65%, #000); transition: transform .12s, box-shadow .12s; position: relative; }
.sw:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
.sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 15px; border: 2px solid var(--c); }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 12px 14px 12px 16px; border-radius: 14px;
  max-width: min(92vw, 480px); box-shadow: 0 12px 30px rgba(0,0,0,.25); display: flex; gap: 12px; align-items: center;
}
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 3px 10px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .toast:not([hidden]) { animation: up .3s cubic-bezier(.2,.8,.2,1); } }
@keyframes up { from { transform: translate(-50%, 16px); opacity: 0; } }

/* phone bottom menu */
.bottom-nav { display: none; }
.bn { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; min-width: 0; }
.bn svg { width: 22px; height: 22px; transition: transform .15s; }
.bn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.bn:active svg { transform: translateY(2px) scale(.9); }
@media (max-width: 760px) {
  .tabs-wrap { display: none; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}

/* next lesson */
.next-grid { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.nx-time b { display: block; font: 700 clamp(22px, 5.4vw, 30px)/1.05 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nx-left { text-align: right; }
.nx-left b { display: block; font: 700 clamp(18px, 4.4vw, 24px)/1.05 var(--f-display); color: var(--accent); white-space: nowrap; }
.dash .next-grid { grid-template-columns: 1fr; gap: 8px; }
.dash .nx-left { text-align: left; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.room-chip { display: inline-flex; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 600; }
.room-chip svg { width: 16px; height: 16px; color: var(--accent); flex: none; }

/* homework groups */
.hw-group h3 { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 12px 0 2px; }
.hw-group:first-child h3 { padding-top: 4px; }
.hw-group h3 + .hw { border-top: 0; }

/* dopusk cards (phone) */
#d-cards { display: none; gap: 12px; }
@media (max-width: 760px) { #d-table-box { display: none; } #d-cards { display: grid; } }
.dcard { display: grid; gap: 12px; }
.dcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.dcard .ins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dcard .ins label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
.dcard .ins input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 9px 10px; font-family: var(--f-mono); font-size: 16px; }
.dcard .ins input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dcard .outs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.dcard .outs div { background: var(--sunk); border-radius: 10px; padding: 6px 4px; min-width: 0; }
.dcard .outs b { display: block; font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.dcard .outs span { font-size: 11px; color: var(--muted); }
.missing { font-size: 13px; color: var(--warn); font-weight: 500; white-space: normal; }
.formula .wrap { white-space: normal; font-family: var(--f-body); font-size: 13.5px; }
.formula strong { font-family: var(--f-body); }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rules label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); align-content: end; }
</style>

let settings = Object.assign({ mode: "system", accent: "blue" }, store.get("uni2.settings", {}));
if (!(settings.accent in ACCENTS)) settings.accent = "blue";
const isDark = () => settings.mode === "dark" || (settings.mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
function applySettings() {
  const root = document.documentElement;
  if (settings.mode === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", settings.mode);
  root.style.setProperty("--accent", (isDark() ? ACCENTS_DARK : ACCENTS)[settings.accent]);
  $$("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === settings.mode));
  $$(".sw").forEach((b) => b.setAttribute("aria-pressed", b.dataset.c === settings.accent));
  store.set("uni2.settings", settings);

const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

function nextLesson(now = new Date()) {
  for (let add = 0; add < 8; add++) {
    const d = new Date(now); d.setDate(d.getDate() + add);
    const nowMin = add === 0 ? now.getHours() * 60 + now.getMinutes() : -1;
    for (const l of SCHEDULE[d.getDay()] || []) {
      if (add === 0 && toMin(l[1]) <= nowMin) continue;
      const start = new Date(d); start.setHours(...l[0].split(":").map(Number), 0, 0);
      const end = new Date(d); end.setHours(...l[1].split(":").map(Number), 0, 0);
      return { l, start, end, ongoing: add === 0 && toMin(l[0]) <= nowMin };
    }
  }
  return null;
}
function fmtLeft(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m} ${t("min")}`;
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return `${h} ${t("hr")}${r ? " " + r + " " + t("min") : ""}`;
  return `${Math.floor(h / 24)} ${t("day")} ${h % 24} ${t("hr")}`;
}

// ================= 5. dopusk calculator =================
// P1 = (ТК1 + РК1)/2, P2 = (ТК2 + РК2)/2, ЕЖР = (P1 + P2)/2, Final = (1 − w)·ЕЖР + w·Exam
// Empty input = no score yet (null), never 0. Thresholds live in RULES and can be changed in Settings.
const DEFAULT_RULES = { adm: 50, pass: 50, stip: 70, wex: 0.4, exmin: null };
let RULES = Object.assign({}, DEFAULT_RULES, store.get("uni2.rules", {}));
const GRADES = [["A",95],["A−",90],["B+",85],["B",80],["B−",75],["C+",70],["C",65],["C−",60],["D+",55],["D",50]]; // assumption, see aLetters
const FIELDS = ["tk1","rk1","tk2","rk2","ex"];
const fieldName = (f) => ({ tk1: "ТК1", rk1: "РК1", tk2: "ТК2", rk2: "РК2", ex: t("exam") }[f]);
let SCORES = store.get("uni2.scores", null) || {
  math: { tk1: 90,    rk1: 80, tk2: null, rk2: null, ex: null },
  prog: { tk1: 85.8,  rk1: 86, tk2: 88,   rk2: 75,   ex: null },
  eng:  { tk1: 89.89, rk1: 90, tk2: null, rk2: null, ex: null },
  hist: { tk1: 94.58, rk1: 95, tk2: 80,   rk2: 85,   ex: 40 },
  phys: { tk1: 89.83, rk1: 70, tk2: 92,   rk2: 90,   ex: 88 },
  phil: { tk1: 30,    rk1: 20, tk2: 40,   rk2: null, ex: null }
};
let selD = "prog";
const avg = (a, b) => (a == null || b == null ? null : (a + b) / 2);
const fmt = (x) => (x == null ? "—" : (Math.round(x * 100) / 100).toString());
const ceil1 = (x) => Math.ceil(x * 10 - 1e-9) / 10;

function calc(s) {
  const P1 = avg(s.tk1, s.rk1), P2 = avg(s.tk2, s.rk2);
  const D = P1 != null && P2 != null ? (P1 + P2) / 2 : null;
  const admitted = D != null && D >= RULES.adm;
  const F = admitted && s.ex != null ? (1 - RULES.wex) * D + RULES.wex * s.ex : null;
  const examFail = F != null && RULES.exmin != null && s.ex < RULES.exmin;
  const missing = [];
  if (P1 == null) ["tk1", "rk1"].forEach((f) => s[f] == null && missing.push(f));
  if (P2 == null) ["tk2", "rk2"].forEach((f) => s[f] == null && missing.push(f));
  if ((D == null || admitted) && s.ex == null) missing.push("ex");
  let state;
  if (P1 == null) state = "empty";
  else if (D == null) state = "needP2";
  else if (!admitted) state = "noadm";
  else if (F == null) state = "adm";
  else if (examFail || F < RULES.pass) state = "summer";
  else state = F >= RULES.stip ? "stip" : "pass";
  return { P1, P2, D, F, state, missing, examFail, needP2: P1 != null ? Math.max(0, 2 * RULES.adm - P1) : null };
}
const examFor = (D, target) => Math.max(RULES.exmin ?? 0, ceil1((target - (1 - RULES.wex) * D) / RULES.wex));

function statusPill(c) {

    needP2: c.needP2 > 100 ? `<span class="pill bad">${t("stNoAdm")}</span>` : `<span class="pill info">${t("stNeedP2", { n: fmt(ceil1(c.needP2)) })}</span>`,
    noadm: `<span class="pill bad">${t("stNoAdm")}</span>`,
    adm: `<span class="pill ok">${t("stAdmOk")}</span>`,
    stip: `<span class="pill ok">${t("stStip")}</span>`,
    pass: `<span class="pill warn">${t("stPass")}</span>`,
    summer: `<span class="pill bad">${t("stSummer")}</span>`
  }[c.state];
}

    const v = el.value.replace(",", ".").replace(/[^\d.]/g, "");
    let n = v === "" ? null : Number(v);
    if (n != null && Number.isNaN(n)) n = null;
    if (n != null) n = Math.min(100, Math.max(0, n));
    const { s, f } = el.dataset;
    SCORES[s][f] = n;
    store.set("uni2.scores", SCORES);
    $$(`input[data-s="${s}"][data-f="${f}"]`).forEach((x) => { if (x !== el) x.value = el.value; });
    selD = s; updateRow(s); markSel(); renderDopuskDetail(); renderDSum(); renderStats();
  });
}
function updateRow(id) {
  const c = calc(SCORES[id]);
  [document.querySelector(`#dt-body tr[data-s="${id}"]`), document.querySelector(`[data-card="${id}"]`)].forEach((el) => {
    if (!el) return;
    el.querySelector('[data-c="P1"]').textContent = fmt(c.P1);
    el.querySelector('[data-c="P2"]').textContent = fmt(c.P2);
    el.querySelector('[data-c="D"]').textContent = fmt(c.D);
    el.querySelector('[data-c="F"]').textContent = fmt(c.F);
    el.querySelector('[data-c="st"]').innerHTML = statusPill(c);
    el.querySelector('[data-c="miss"]').textContent = missingText(c);
  });
}
function markSel() {
  $$("#dt-body tr").forEach((tr) => tr.classList.toggle("sel", tr.dataset.s === selD));
  $$(".dcard").forEach((c) => c.classList.toggle("sel", c.dataset.card === selD));
}

function ring(value, label, lo, hi) {
  const R0 = 80, C = 2 * Math.PI * R0, v = value == null ? 0 : Math.max(0, Math.min(100, value));
  const color = value == null ? "var(--line)" : value >= hi ? "var(--ok)" : value >= lo ? "var(--warn)" : "var(--bad)";
  const tick = (p) => { const a = (p / 100) * 2 * Math.PI - Math.PI / 2; return `<line class="tick" x1="${100 + Math.cos(a) * 68}" y1="${100 + Math.sin(a) * 68}" x2="${100 + Math.cos(a) * 92}" y2="${100 + Math.sin(a) * 92}" stroke-width="2"/>`; };
  return `<svg class="ring" viewBox="0 0 200 200" role="img" aria-label="${esc(label)} ${fmt(value)}">
    <circle class="track" cx="100" cy="100" r="${R0}" fill="none" stroke-width="16"/>
    <circle class="arc" cx="100" cy="100" r="${R0}" fill="none" stroke-width="16" stroke-linecap="round"
      style="stroke:${color};stroke-dasharray:${(v / 100) * C} ${C}" transform="rotate(-90 100 100)"/>
    ${tick(lo)}${hi !== lo ? tick(hi) : ""}
    <text x="100" y="104" text-anchor="middle" font-size="34" font-weight="700">${value == null ? "—" : fmt(Math.round(value * 10) / 10)}</text>
    <text class="sub" x="100" y="128" text-anchor="middle">${esc(label)}</text>
  </svg>`;
}
function renderDopuskDetail() {
  const s = subj(selD), sc = SCORES[selD], c = calc(sc);
  const w = RULES.wex, wd = Math.round((1 - w) * 100) / 100;
  const step = (k, label, v) => `<div class="step"><span class="k">${k}</span><span>${label}</span><span class="v">${fmt(v)}</span></div>`;
  const msgs = [];
  let extra = "";
  if (c.missing.length) msgs.push(["warn", missingText(c)]);
  if (c.state === "needP2") {
    if (c.needP2 > 100) msgs.push(["bad", t("impossibleP2", { adm: RULES.adm })]);
    else {
      msgs.push(["info", t("needP2", { n: fmt(ceil1(c.needP2)), sum: fmt(ceil1(c.needP2 * 2)) })]);
      if (sc.tk2 != null && sc.rk2 == null) {
        const r2 = ceil1(2 * c.needP2 - sc.tk2);
        msgs.push(r2 > 100 ? ["bad", t("impossibleP2", { adm: RULES.adm })] : ["info", t("needRk2", { n: fmt(Math.max(0, r2)), tk2: fmt(sc.tk2) })]);
      }
    }
  }
  if (c.state === "noadm") msgs.push(["bad", t("admFail", { adm: RULES.adm, d: fmt(c.D), m: fmt(Math.round((RULES.adm - c.D) * 100) / 100) })]);
  if (c.D != null && c.D >= RULES.adm) {
    if (c.F == null) {
      msgs.push(["ok", t("admOk")]);
      const ep = examFor(c.D, RULES.pass), es = examFor(c.D, RULES.stip);
      msgs.push(ep > 100 ? ["bad", t("examNoPass", { pass: RULES.pass })] : ["warn", t("examNeed50", { n: fmt(ep), pass: RULES.pass })]);
      msgs.push(es > 100 ? ["bad", t("examNo70", { stip: RULES.stip })] : ["info", t("examNeed70", { n: fmt(es), stip: RULES.stip })]);
    } else {
      const f = fmt(Math.round(c.F * 100) / 100);
      if (c.examFail) msgs.push(["bad", t("examBelowMin", { e: fmt(sc.ex), m: RULES.exmin })]);
      else msgs.push(c.state === "stip" ? ["ok", t("finStip", { f })] : c.state === "pass" ? ["warn", t("finPass", { f, stip: RULES.stip })] : ["bad", t("finSummer", { f, pass: RULES.pass })]);
    }
    if (RULES.exmin == null) msgs.push(["info", t("noExamMin")]);
    extra = `<div style="display:grid;gap:10px;margin-top:20px">
      <span class="label">${t("examFor")}</span>
      <div class="grades">${GRADES.map(([g, T0]) => {
        const E = examFor(c.D, T0);
        return E > 100 ? `<div class="grade no"><span class="g">${g}</span><span class="small muted">≥${T0} · ${t("unreachable")}</span></div>`
          : `<div class="grade ${T0 >= RULES.stip ? "stip" : ""}"><span class="g">${g}</span><span class="small"><span class="num">${fmt(E)}</span> ${t("points")}</span><span class="small muted">≥${T0}${T0 === RULES.stip ? " · " + t("stipMark") : ""}</span></div>`;
      }).join("")}</div></div>`;
  }
  const big = c.F != null ? ring(c.F, t("finalScore"), RULES.pass, RULES.stip) : ring(c.D, t("admShort"), RULES.adm, RULES.adm);
  $("#d-detail").innerHTML = `
    <div class="row between" style="margin-bottom:14px"><h2>${esc(L(s.name))}</h2>${statusPill(c)}</div>
    <div class="d-detail">
      <div>${big}</div>
      <div style="display:grid;gap:10px">
        <div class="steps">
          ${step("Р1", "(ТК1 + РК1) / 2", c.P1)}
          ${step("Р2", "(ТК2 + РК2) / 2", c.P2)}
          ${step(t("admShort"), `(Р1 + Р2) / 2 · ${t("admRating")}`, c.D)}
          ${step("Σ", `${wd} × ${t("admShort")} + ${w} × ${t("exam")}`, c.F)}
        </div>
        ${msgs.map(([k, m]) => `<div class="callout ${k}">${esc(m)}</div>`).join("")}
      </div>
    </div>${extra}`;
}
function renderDSum() {
  const cs = SUBJECTS.map((s) => calc(SCORES[s.id]));
  const adm = cs.filter((c) => c.D != null && c.D >= RULES.adm).length;
  const risk = cs.filter((c) => c.state === "noadm" || c.state === "summer" || (c.state === "needP2" && c.needP2 > 100)).length;
  const stip = cs.filter((c) => c.state === "stip").length;
  const lost = cs.filter((c) => c.state === "pass").length;
  const tile = (n, k, color) => `<div class="stat"><b style="color:${color}">${n}<span class="small muted" style="font:500 13px var(--f-body)"> / ${SUBJECTS.length}</span></b><span>${t(k)}</span></div>`;
  $("#d-sum").innerHTML = tile(adm, "sumAdm", "var(--accent)") + tile(risk, "sumRisk", "var(--bad)") + tile(stip, "sumStip", "var(--ok)") + tile(lost, "sumLost", "var(--warn)");
  const w = RULES.wex, wd = Math.round((1 - w) * 100) / 100;
  $("#formula").innerHTML = `
    <div class="row between" style="white-space:normal"><strong>${t("fGiven")}</strong><button class="b3 sm" id="edit-rules">${t("editRules")}</button></div>
    <div>Р1 = (ТК1 + РК1) / 2 · Р2 = (ТК2 + РК2) / 2</div>
    <div>${t("admShort")} = (Р1 + Р2) / 2 · ${t("final")} = ${wd} × ${t("admShort")} + ${w} × ${t("exam")}</div>
    <div class="wrap">${esc(t("fAdm", { adm: RULES.adm }))}</div>
    <div class="wrap">${esc(t("fRules", { pass: RULES.pass, stip: RULES.stip }))}</div>
    <strong style="margin-top:8px">${t("fAssume")}</strong>
    <div class="wrap">• ${esc(RULES.exmin == null ? t("aExMinUnknown") : t("aExMinSet", { m: RULES.exmin }))}</div>
    <div class="wrap">• ${esc(t("aLetters"))}</div>
    <div class="wrap">• ${esc(t("aRound"))}</div>`;
  $("#edit-rules").onclick = () => { openSettings(true); $("#rules-opt").scrollIntoView({ block: "start" }); };
}

// grading rules (Settings)
function renderRules() {
  ["adm", "pass", "stip", "wex", "exmin"].forEach((k) => { const el = $("#rule-" + k); if (document.activeElement !== el) el.value = RULES[k] ?? ""; });
  $("#rule-exmin").placeholder = t("unknown");
}
function refreshDopusk() { SUBJECTS.forEach((s) => updateRow(s.id)); renderDopuskDetail(); renderDSum(); renderStats(); }
["adm", "pass", "stip", "wex", "exmin"].forEach((k) => $("#rule-" + k).oninput = (e) => {
  const v = e.target.value.replace(",", ".").trim();
  let n = v === "" ? null : Number(v);
  if (n != null && Number.isNaN(n)) return;
  if (k === "wex") { if (n == null || n <= 0 || n >= 1) return; }
  else if (k !== "exmin" && n == null) return;
  if (n != null && k !== "wex") n = Math.min(100, Math.max(0, n));
  RULES[k] = n; store.set("uni2.rules", RULES); refreshDopusk();
});
$("#rules-reset").onclick = () => { RULES = Object.assign({}, DEFAULT_RULES); store.set("uni2.rules", RULES); renderRules(); refreshDopusk(); };

// ================= hero stats + boot =================
function renderStats() {
  const d = new Date(), today = d.getDay(), nowMin = d.getHours() * 60 + d.getMinutes();
  $("#today-pill").textContent = `${t("days")[today]}, ${d.getDate()} ${t("months")[d.getMonth()]}`;
  // landing greeting
  const todays = SCHEDULE[today] || [], left = todays.filter((l) => toMin(l[1]) > nowMin).length;
  $("#land-title").textContent = !todays.length ? t("heroNone") : left ? t("heroToday", { n: left }) : t("heroDone");
  const n = nextLesson();
  $("#land-sub").textContent = n ? t("heroNext", { s: L(subj(n.l[2]).name), time: `${n.start.toDateString() === d.toDateString() ? "" : t("days")[n.start.getDay()] + ", "}${n.l[0]}`, room: L(n.l[4]) }) : t("noWeek");
  const open = HW.filter((h) => !DONE.has(h.id)).sort((a, b) => a.due.localeCompare(b.due));
  $("#land-hw").textContent = t("hwBtn", { n: open.length });
  // nearest homework
  $("#dash-hw").innerHTML = `<div class="card-head"><span class="label">${t("nearTasks")}</span><span class="pill ${open.length ? "warn" : "ok"}">${open.length}</span></div>
    ${open.length ? `<div>${open.slice(0, 3).map((h) => `<div class="mini-hw"><div class="row between"><strong>${esc(L(subj(h.subj).name))}</strong>${dueChip(h.due)}</div><p>${esc(h.text)}</p></div>`).join("")}</div>` : `<p class="muted">${t("noOpen")}</p>`}
    <button class="b3 sm link-btn" data-goto="homework">${t("allTasks")}</button>`;
  // admission snapshot
  const cs = SUBJECTS.map((s) => calc(SCORES[s.id]));
  const adm = cs.filter((c) => c.D != null && c.D >= RULES.adm).length;
  const risk = cs.filter((c) => c.state === "noadm" || c.state === "summer" || (c.state === "needP2" && c.needP2 > 100)).length;
  const need = cs.filter((c) => c.missing.length).length;
  $("#dash-adm").innerHTML = `<div class="card-head"><span class="label">${t("admCard")}</span>${risk ? `<span class="pill bad">${t("sumRisk")}: ${risk}</span>` : ""}</div>
    <div class="adm-row">
      <div><b style="color:var(--accent)">${adm}/${SUBJECTS.length}</b><span>${t("sumAdm")}</span></div>
      <div><b style="color:var(--bad)">${risk}</b><span>${t("sumRisk")}</span></div>
      <div><b style="color:var(--warn)">${need}</b><span>${t("stNeedData")}</span></div>
    </div>
    <button class="b3 sm link-btn" data-goto="dopusk">${t("admOpen")}</button>`;
  $$("[data-goto]").forEach((b) => b.onclick = () => { showTab(b.dataset.goto); scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); });
}
function renderStatic() {
  $$("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
  $$("[data-i-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.iAria)));
  $("#lang-quick").textContent = lang === "kk" ? "EN" : "ҚАЗ";
  $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#hw-text").placeholder = t("hwPlaceholder");
  $("#hw-subj").innerHTML = SUBJECTS.map((s) => `<option value="${s.id}">${esc(L(s.name))}</option>`).join("");
  $$(".sw").forEach((b) => { b.title = T[lang].colors[b.dataset.c]; b.setAttribute("aria-label", T[lang].colors[b.dataset.c]); });
  document.title = t("brand");
  $("#land-img").alt = t("photoAlt");
  $$("[data-scroll]").forEach((b) => b.onclick = () => $("#" + b.dataset.scroll).scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }));
}
function renderAll() {
  renderStatic(); renderTabs(); showTab(curTab); renderRemindOptions();
  renderDays(); renderNext(); renderLessons(); setRole(role);
  renderSubjects(); renderInfo(); renderRules(); renderDopuskTable(); renderDopuskDetail(); renderDSum(); renderStats();
}
document.documentElement.lang = lang;
curTab = location.hash.slice(1) || "schedule";
applySettings();
renderAll();
setInterval(() => { renderNext(); renderLessons(); renderStats(); checkReminder(); }, 30000);
</script>
